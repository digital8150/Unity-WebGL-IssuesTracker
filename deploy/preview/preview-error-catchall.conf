# Catch-all for deleted or unknown PR preview hosts.
# Keep this file lexically after per-PR vhosts so active previews win first.

<VirtualHost *:80>
    ServerName preview-catchall.invalid
    ServerAlias *.preview.codingbot.kr

    Alias /__preview-errors/ /var/www/preview-errors/
    AliasMatch ^/(?:.*/)?error\.css$ /var/www/preview-errors/error.css
    AliasMatch ^/(?:.*/)?assets/(error-(?:400|403|404|500|503)\.png)$ /var/www/preview-errors/assets/$1
    <Directory /var/www/preview-errors>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    Header always unset Server

    ErrorDocument 400 /__preview-errors/400.html
    ErrorDocument 403 /__preview-errors/403.html
    ErrorDocument 404 /__preview-errors/404.html
    ErrorDocument 500 /__preview-errors/500.html
    ErrorDocument 503 /__preview-errors/503.html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/__preview-errors/
    RewriteCond %{REQUEST_URI} !/error\.css$
    RewriteCond %{REQUEST_URI} !/assets/error-(?:400|403|404|500|503)\.png$
    RewriteRule ^ - [R=404,END]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName preview-catchall.invalid
    ServerAlias *.preview.codingbot.kr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/preview.codingbot.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/preview.codingbot.kr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Alias /__preview-errors/ /var/www/preview-errors/
    AliasMatch ^/(?:.*/)?error\.css$ /var/www/preview-errors/error.css
    AliasMatch ^/(?:.*/)?assets/(error-(?:400|403|404|500|503)\.png)$ /var/www/preview-errors/assets/$1
    <Directory /var/www/preview-errors>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    Header always unset Server

    ErrorDocument 400 /__preview-errors/400.html
    ErrorDocument 403 /__preview-errors/403.html
    ErrorDocument 404 /__preview-errors/404.html
    ErrorDocument 500 /__preview-errors/500.html
    ErrorDocument 503 /__preview-errors/503.html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/__preview-errors/
    RewriteCond %{REQUEST_URI} !/error\.css$
    RewriteCond %{REQUEST_URI} !/assets/error-(?:400|403|404|500|503)\.png$
    RewriteRule ^ - [R=404,END]
</VirtualHost>
</IfModule>
